name: render-studio
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER:-render_studio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-render_studio_local}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:51025:1025"
      - "127.0.0.1:58025:8025"
volumes:
  postgres_data:
